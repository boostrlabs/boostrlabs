name: BOOSTR Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "public/**"
      - "functions/**"
      - "agent-migrations/**"
      - "migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.js"
      - "wrangler.toml"
      - ".github/workflows/boostr-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boostr-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build BOOSTR production bundle
        run: pnpm run build

      - name: Verify production bundle
        run: |
          test -f dist/index.html
          test -f dist/assets/agent-os/app.js
          test -d functions
          grep -q "BOOSTR Labs | Soluciones digitales" dist/index.html
          echo "Built commit: $GITHUB_SHA"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy BOOSTR to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name=boostrlabs
          --branch=main
          --commit-hash="${{ github.sha }}"
          --commit-message="BOOSTR deploy ${{ github.sha }}"

      - name: Confirm live site responds
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "https://boostrlabs.pages.dev/?deploy=${GITHUB_SHA}" | grep -q "BOOSTR Labs | Soluciones digitales"; then
              echo "BOOSTR production is responding after deploy."
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare deploy command completed, but live verification did not match in time."
          exit 1
