name: NNE Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/nne-community/**"
      - "functions/api/nne/**"
      - "functions/_lib/nne-*.js"
      - "functions/join/**"
      - "migrations/**"
      - "scripts/prepare-nne-deploy.mjs"
      - ".github/workflows/nne-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nne-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NNE production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone NNE deploy package
        run: node scripts/prepare-nne-deploy.mjs

      - name: Verify Pages Functions package
        run: |
          test ! -f .deploy/nne/site/_worker.js
          test -f .deploy/nne/functions/api/nne/integrations/meta/webhook.js
          test -f .deploy/nne/site/index.html

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy NNE production to Cloudflare Pages
        working-directory: .deploy/nne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy site
          --project-name=nne-westdetro
          --branch=main
          --commit-hash="${{ github.sha }}"
          --commit-message="NNE deploy ${{ github.sha }}"
