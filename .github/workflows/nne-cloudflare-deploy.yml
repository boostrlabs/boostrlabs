name: NNE Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      production_branch:
        description: "Cloudflare Pages production branch for nne-westdetro"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nne-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested NNE revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone NNE deploy package
        run: node scripts/prepare-nne-deploy.mjs

      - name: Verify packaged Meta webhook exists
        run: test -f .deploy/nne/functions/api/nne/integrations/meta/webhook.js

      - name: Deploy NNE to Cloudflare Pages
        working-directory: .deploy/nne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy site
          --project-name=nne-westdetro
          --branch="${{ inputs.production_branch }}"
          --commit-hash="${{ github.sha }}"
          --commit-message="NNE deploy ${{ github.sha }}"
