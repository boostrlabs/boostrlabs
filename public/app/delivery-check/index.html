<!doctype html>
<html lang="es" data-build="1.1.0" data-boostr-surface="delivery-check" data-boostr-theme="night_blue" data-boostr-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1118">
  <title>BOOSTR Delivery Check</title>
  <link rel="icon" href="/assets/icons/09.-b-star-favicon.png">
  <link rel="stylesheet" href="/assets/boostr-mother/mother.css?v=1.1.0">
  <style>
    .delivery-shell{max-width:760px;margin:0 auto;padding:20px 16px 110px}.delivery-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.delivery-head h1{margin:4px 0 0;font-size:clamp(28px,7vw,48px)}.delivery-meta{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px}.decision{padding:24px 18px;text-align:center;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);margin-bottom:18px}.decision strong{display:block;font-size:clamp(30px,8vw,56px);line-height:1.02;margin:8px 0}.decision small{font-size:15px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick-field label{display:block;text-align:center;margin-bottom:7px}.quick-input{display:flex;align-items:center;border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:14px 10px;background:rgba(255,255,255,.025)}.quick-input span{font-size:22px}.quick-input input{width:100%;min-width:0;border:0;background:transparent;color:inherit;text-align:center;font-size:30px;outline:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{padding:16px;border-radius:18px;background:rgba(255,255,255,.06);text-align:center}.stat b{display:block;font-size:26px;margin-top:4px}.warning{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12)}.reset{width:100%;margin-top:14px}.footer-nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(8,12,18,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08)}.footer-nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.footer-nav a{text-align:center;padding:10px;border-radius:12px;text-decoration:none}.footer-nav a.active{background:rgba(255,255,255,.08)}@media(max-width:520px){.delivery-head{align-items:flex-start}.quick-grid{gap:7px}.quick-input{padding:12px 6px}.quick-input input{font-size:25px}.stats{grid-template-columns:1fr 1fr}.decision{padding:20px 12px}}
  </style>
</head>
<body>
  <main class="delivery-shell">
    <header class="delivery-head">
      <div><span class="eyebrow">BOOSTR LABS · TOOLS</span><h1>Delivery Check</h1></div>
      <span class="delivery-meta">Meta: $20/h</span>
    </header>

    <section class="decision" aria-live="polite">
      <span class="eyebrow">DECISIÓN</span>
      <strong id="decision">METE LA ORDEN</strong>
      <small id="reason">Pago, minutos y millas.</small>
    </section>

    <section class="quick-grid" aria-label="Datos de la orden">
      <div class="quick-field"><label for="pay">Paga</label><div class="quick-input"><span>$</span><input id="pay" inputmode="decimal" type="number" min="0" step="0.01" placeholder="16"></div></div>
      <div class="quick-field"><label for="minutes">Min</label><div class="quick-input"><input id="minutes" inputmode="numeric" type="number" min="1" step="1" placeholder="45"></div></div>
      <div class="quick-field"><label for="miles">Millas</label><div class="quick-input"><input id="miles" inputmode="decimal" type="number" min="0" step="0.1" placeholder="20"></div></div>
    </section>

    <section class="stats">
      <div class="stat"><span>Ritmo por hora</span><b id="hourly">—</b></div>
      <div class="stat"><span>Pago por milla</span><b id="perMile">—</b></div>
    </section>

    <div id="warning" class="warning" hidden></div>
    <button id="reset" class="btn reset" type="button">NUEVA ORDEN</button>
  </main>

  <nav class="footer-nav" aria-label="BOOSTR navigation"><div class="footer-nav-inner"><a href="/home/">Inicio</a><a href="/modules/">Módulos</a><a class="active" href="/app/delivery-check/">Delivery</a></div></nav>

  <script>
    const pay=document.getElementById('pay');
    const minutes=document.getElementById('minutes');
    const miles=document.getElementById('miles');
    const decision=document.getElementById('decision');
    const reason=document.getElementById('reason');
    const hourly=document.getElementById('hourly');
    const perMile=document.getElementById('perMile');
    const warning=document.getElementById('warning');
    const currency=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});

    function evaluate(){
      const p=Number(pay.value), m=Number(minutes.value), mi=Number(miles.value);
      if(!(p>0)||!(m>0)||!(mi>0)){
        decision.textContent='METE LA ORDEN'; reason.textContent='Pago, minutos y millas.'; hourly.textContent='—'; perMile.textContent='—'; warning.hidden=true; return;
      }
      const hourlyRate=p/(m/60), mileRate=p/mi;
      hourly.textContent=currency.format(hourlyRate)+'/h';
      perMile.textContent=currency.format(mileRate);

      if(hourlyRate>=20){
        decision.textContent='ACÉPTALA';
        reason.textContent='Cumple tu meta mínima de $20 por hora.';
      }else if(hourlyRate>=18){
        decision.textContent='DECIDE SEGÚN MILLAS';
        reason.textContent='Está cerca de tu meta; revisa si el recorrido vale la pena.';
      }else{
        decision.textContent='ESPERA LA SIGUIENTE';
        reason.textContent='No llega a tu meta mínima por hora.';
      }

      if(mileRate>=1.5){warning.textContent='Excelente recorrido: '+currency.format(mileRate)+' por milla.';warning.hidden=false;}
      else if(mileRate>=1){warning.textContent='Recorrido aceptable: '+currency.format(mileRate)+' por milla.';warning.hidden=false;}
      else{warning.textContent='Advertencia: muchas millas para este pago ('+currency.format(mileRate)+' por milla).';warning.hidden=false;}
    }

    [pay,minutes,miles].forEach(input=>input.addEventListener('input',evaluate));
    document.getElementById('reset').addEventListener('click',()=>{pay.value='';minutes.value='';miles.value='';evaluate();pay.focus();});
    pay.focus();
  </script>
</body>
</html>
