<!doctype html>
<html lang="es" data-build="2.2.0" data-no-shared-ui="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BOOSTR Delivery Check</title>
  <link rel="icon" href="/assets/icons/09.-b-star-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/assets/icons/09.-b-star-favicon.png?v=4">
  <style>
    :root{color-scheme:dark;--bg:#07101d;--line:rgba(255,255,255,.12);--text:#f7f9fc;--blue:#48bfff;--green:#55e98a;--green-bg:rgba(85,233,138,.13);--red:#ff6b78;--red-bg:rgba(255,107,120,.13);--amber:#f4be5f;--amber-bg:rgba(244,190,95,.13)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    body{background:radial-gradient(circle at 90% 0,rgba(72,191,255,.15),transparent 30%),linear-gradient(180deg,#0b1728,#05080e 78%)}
    body>*:not(main):not(script){display:none!important}
    img{max-width:100%;display:block} button,input{font:inherit}
    .app{width:min(720px,100%);margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overflow:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{width:148px;min-width:0}.back{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:15px;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.04);font-size:22px}
    .eyebrow{margin:0 0 7px;color:var(--blue);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}h1{margin:0 0 18px;font-size:clamp(32px,9vw,54px);line-height:.98;letter-spacing:-.05em;overflow-wrap:anywhere}
    .decision{border:1px solid var(--line);border-radius:28px;padding:24px 18px;text-align:center;background:rgba(255,255,255,.04);transition:.2s ease;overflow:hidden}.decision.good{border-color:rgba(85,233,138,.55);background:var(--green-bg)}.decision.bad{border-color:rgba(255,107,120,.55);background:var(--red-bg)}.decision.maybe{border-color:rgba(244,190,95,.55);background:var(--amber-bg)}
    .decision .label{color:var(--blue);font-size:12px;letter-spacing:.2em;font-weight:900}.decision.good .label,.decision.good strong{color:var(--green)}.decision.bad .label,.decision.bad strong{color:var(--red)}.decision.maybe .label,.decision.maybe strong{color:var(--amber)}.decision strong{display:block;margin:10px auto 8px;max-width:100%;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:-.05em;overflow-wrap:anywhere}.decision p{margin:0;color:#dbe3ee;font-size:15px;line-height:1.4}
    .quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}.field{min-width:0}.field label{display:block;margin-bottom:7px;text-align:center;font-size:14px}.input-wrap{min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);padding:12px 8px;overflow:hidden}.input-wrap span{flex:0 0 auto;font-size:22px}.input-wrap input{width:100%;min-width:0;max-width:100%;border:0;outline:0;background:transparent;color:#fff;text-align:center;font-size:28px;padding:0}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.stat{min-width:0;overflow:hidden;border-radius:22px;background:rgba(255,255,255,.055);padding:16px 10px;text-align:center}.stat span{display:block;color:#dce4ee;font-size:13px}.stat b{display:block;margin-top:5px;font-size:clamp(24px,7vw,38px);line-height:1;overflow-wrap:anywhere}.warning{margin-top:12px;border:1px solid var(--line);border-radius:18px;padding:13px 14px;color:#dce4ee;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.reset{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);color:#fff;padding:15px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.nav a{min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;color:#dfe7f1;text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:430px){.app{padding-left:10px;padding-right:10px}.brand{width:132px}.quick-grid{gap:6px}.input-wrap{padding:11px 5px}.input-wrap input{font-size:24px}.input-wrap span{font-size:19px}.decision{padding:22px 12px}.stats{gap:8px}.stat{padding:15px 8px}.nav a{font-size:12px;padding:11px 5px}}
  </style>
</head>
<body>
  <main class="app" id="deliveryApp">
    <header class="topbar"><a href="/app/" class="brand" aria-label="BOOSTR"><img src="/assets/logos/boostr-logo-nav.png?v=4" alt="BOOSTR Labs"></a><a class="back" href="/app/" aria-label="Volver">←</a></header>
    <p class="eyebrow">BOOSTR LABS · TOOLS</p><h1>Delivery Check</h1>
    <section id="decisionCard" class="decision" aria-live="polite"><span class="label">DECISIÓN</span><strong id="decision">METE LA ORDEN</strong><p id="reason">Pago, minutos y millas.</p></section>
    <section class="quick-grid" aria-label="Datos de la orden">
      <div class="field"><label for="pay">Paga</label><div class="input-wrap"><span>$</span><input id="pay" inputmode="decimal" type="number" min="0" step="0.01" placeholder="16"></div></div>
      <div class="field"><label for="minutes">Min</label><div class="input-wrap"><input id="minutes" inputmode="numeric" type="number" min="1" step="1" placeholder="45"></div></div>
      <div class="field"><label for="miles">Millas</label><div class="input-wrap"><input id="miles" inputmode="decimal" type="number" min="0" step="0.1" placeholder="20"></div></div>
    </section>
    <section class="stats"><div class="stat"><span>Ritmo por hora</span><b id="hourly">—</b></div><div class="stat"><span>Pago por milla</span><b id="perMile">—</b></div></section>
    <div id="warning" class="warning" hidden></div><button id="reset" class="reset" type="button">NUEVA ORDEN</button>
    <nav class="nav" aria-label="BOOSTR navigation"><a href="/app/">Inicio</a><a href="/modules/">Módulos</a><a href="/app/delivery-check/">Delivery</a></nav>
  </main>
  <script>
    const app=document.getElementById('deliveryApp');
    function purgeChrome(root=document){
      root.querySelectorAll('*').forEach((el)=>{
        if(el===app||app.contains(el)||el.tagName==='SCRIPT'||el.tagName==='STYLE') return;
        const text=(el.textContent||'').replace(/\s+/g,' ').trim();
        let fixed=false;
        try{const s=getComputedStyle(el);fixed=s.position==='fixed'||s.position==='sticky';}catch(_){ }
        if(fixed||text.includes('Workspace OS')||text.includes('WESTDETRO Artist')||text==='EN ES'||text.includes('OSWorkspace')) el.remove();
        if(el.shadowRoot) purgeChrome(el.shadowRoot);
      });
      [...document.body.children].forEach((el)=>{if(el!==app&&el.tagName!=='SCRIPT')el.remove();});
    }
    new MutationObserver(()=>purgeChrome()).observe(document.documentElement,{childList:true,subtree:true});
    setInterval(()=>purgeChrome(),250);
    purgeChrome();

    const pay=document.getElementById('pay'),minutes=document.getElementById('minutes'),miles=document.getElementById('miles'),decision=document.getElementById('decision'),reason=document.getElementById('reason'),hourly=document.getElementById('hourly'),perMile=document.getElementById('perMile'),warning=document.getElementById('warning'),card=document.getElementById('decisionCard');
    const currency=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
    function setState(type,title,copy){card.className='decision'+(type?' '+type:'');decision.textContent=title;reason.textContent=copy;}
    function evaluate(){const p=Number(pay.value),m=Number(minutes.value),mi=Number(miles.value);if(!(p>0)||!(m>0)||!(mi>0)){setState('','METE LA ORDEN','Pago, minutos y millas.');hourly.textContent='—';perMile.textContent='—';warning.hidden=true;return;}const hourlyRate=p/(m/60),mileRate=p/mi;hourly.textContent=currency.format(hourlyRate)+'/h';perMile.textContent=currency.format(mileRate);if(hourlyRate>=20)setState('good','ACÉPTALA','Cumple tu meta mínima de $20 por hora.');else if(hourlyRate>=18)setState('maybe','DECIDE SEGÚN MILLAS','Está cerca de tu meta; revisa si el recorrido vale la pena.');else setState('bad','ESPERA LA SIGUIENTE','No llega a tu meta mínima por hora.');warning.textContent=mileRate>=1.5?'Excelente recorrido: '+currency.format(mileRate)+' por milla.':mileRate>=1?'Recorrido aceptable: '+currency.format(mileRate)+' por milla.':'Advertencia: muchas millas para este pago ('+currency.format(mileRate)+' por milla).';warning.hidden=false;}
    [pay,minutes,miles].forEach(input=>input.addEventListener('input',evaluate));document.getElementById('reset').addEventListener('click',()=>{pay.value='';minutes.value='';miles.value='';evaluate();pay.focus();});pay.focus();
  </script>
</body>
</html>
