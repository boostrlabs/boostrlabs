<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BOOSTR Agent | Verificación oficial</title><link rel="icon" href="/assets/icons/09.-b-star-favicon.png"><style>:root{--ink:#070709;--muted:#74747c;--line:#e7e7ec;--green:#39cb67}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f7fa;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{background:radial-gradient(circle at 80% 0%,rgba(207,232,255,.55),transparent 28%),radial-gradient(circle at 8% 92%,rgba(255,226,239,.45),transparent 30%),#f7f7fa}.top{padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.86);backdrop-filter:blur(24px)}.top img{width:145px}.shell{max-width:720px;margin:0 auto;padding:34px 18px 70px}.hero{background:#09090b;color:#fff;border-radius:34px;padding:32px;box-shadow:0 26px 90px rgba(0,0,0,.15);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-150px;bottom:-260px;background:radial-gradient(circle,rgba(188,181,255,.48),rgba(134,200,255,.18) 48%,transparent 72%)}.hero>*{position:relative;z-index:1}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;color:#aaaab2}.hero h1{font-family:"Arial Black",Arial,sans-serif;text-transform:lowercase;font-size:clamp(45px,10vw,72px);line-height:.86;letter-spacing:-.065em;margin:18px 0 14px}.hero p{color:#cfcfd6;line-height:1.5}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:0 16px 54px rgba(20,20,30,.05)}.identity{display:flex;gap:18px;align-items:center}.photo{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,#dcd8ff,#cfe8ff,#ffe2ef);display:grid;place-items:center;font-family:"Arial Black",Arial,sans-serif;font-size:34px;overflow:hidden;flex:0 0 auto}.photo img{width:100%;height:100%;object-fit:cover}.name{font-family:"Arial Black",Arial,sans-serif;text-transform:lowercase;font-size:38px;line-height:.9;letter-spacing:-.055em}.verified{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--green);font-weight:900}.check{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px}.meta{color:var(--muted);margin-top:8px;line-height:1.45}.status{display:inline-flex;margin-top:14px;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900;background:#e4f8ea;color:#23733d}.status.inactive{background:#efeff3;color:#696971}.history{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.history div{background:#f8f8fb;border:1px solid #ececf1;border-radius:16px;padding:13px}.history small{display:block;text-transform:uppercase;letter-spacing:.12em;color:#85858d;font-size:9px;font-weight:900;margin-bottom:5px}.history b{font-size:13px}.note{margin-top:14px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#f0edff,#edf8ff);color:#56565e;line-height:1.5}.loading{padding:40px;text-align:center;color:#777}@media(max-width:520px){.shell{padding:20px 12px 52px}.hero,.card{padding:22px;border-radius:26px}.identity{display:block}.photo{width:94px;height:94px;margin-bottom:17px;border-radius:25px}.name{font-size:34px}.history{grid-template-columns:1fr}}</style></head><body><header class="top"><img src="/assets/logos/boostr-logo-nav.png" alt="BOOSTR Labs"></header><main class="shell"><section class="hero"><div class="eyebrow">verificación oficial</div><h1>BOOSTR agent.</h1><p>Esta página confirma si la persona que te mostró este QR forma parte oficialmente del equipo de agentes de BOOSTR.</p></section><div id="profile" class="card loading">verificando credencial...</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const initials=n=>String(n||'BOOSTR Agent').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();const fmt=d=>d?new Date(d).toLocaleDateString('es-US',{year:'numeric',month:'short',day:'numeric'}):'—';(async()=>{const id=new URLSearchParams(location.search).get('id'),box=document.querySelector('#profile');if(!id){box.innerHTML='<b>credencial inválida.</b>';return}try{const r=await fetch('/api/agent-public/verify/'+encodeURIComponent(id));const a=await r.json();if(!r.ok)throw new Error(a.error||'No encontrada');box.classList.remove('loading');box.innerHTML=`<div class="identity"><div class="photo">${a.photo_url?`<img src="${esc(a.photo_url)}" alt="${esc(a.name)}">`:esc(initials(a.name))}</div><div><div class="name">${esc(a.name)}</div><div class="verified"><span class="check">✓</span> identidad confirmada por BOOSTR</div><div class="meta">${esc([a.city,a.country].filter(Boolean).join(', ')||'BOOSTR Agent LATAM')}</div><span class="status ${a.status==='ACTIVE'?'':'inactive'}">${a.status==='ACTIVE'?'agente activo':'ya no es agente activo'}</span></div></div><div class="history"><div><small>inicio</small><b>${fmt(a.active_from)}</b></div><div><small>${a.status==='ACTIVE'?'estado actual':'finalizó'}</small><b>${a.status==='ACTIVE'?'activo':fmt(a.active_to)}</b></div></div>${a.status==='ACTIVE'?`<div class="note"><b>✓ puedes verificar su relación con BOOSTR aquí.</b><br>Los pagos de servicios se realizan directamente a BOOSTR, no al agente.</div>`:`<div class="note"><b>historial verificado.</b><br>Esta persona trabajó como BOOSTR Agent durante las fechas mostradas, pero actualmente no aparece como agente activo.</div>`}`;}catch(e){box.innerHTML='<b>no pudimos verificar esta credencial.</b><p>Revisa que el QR o enlace sea el oficial de BOOSTR.</p>'}})();</script></body></html>
