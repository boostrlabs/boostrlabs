const sections=[['welcome','bienvenida'],['profile','tu perfil'],['leads','cómo detectar leads'],['products','cómo elegir producto'],['open','cómo abrir conversación'],['kit','tu kit de trabajo'],['answers','mensajes + FAQ'],['start','primer objetivo']];let current=0,apps=[],catalog=[],scripts=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),parse=s=>{try{return JSON.parse(s||'{}')}catch{return {}}},arr=v=>Array.isArray(v)?v.join(', '):(v||'—');async function api(p){const r=await fetch('/api/agent-os/'+p,{credentials:'include'});if(!r.ok)throw Error('login admin requerido');return r.json()}
function build(){$('#nav').innerHTML=sections.map((s,i)=>`<button data-i="${i}" class="${!i?'active':''}">${String(i+1).padStart(2,'0')} · ${s[1]}</button>`).join('');$('#panels').innerHTML=`
<section class="panel active"><div class="hero"><div class="kicker">BIENVENIDO A BOOSTR AGENT</div><h2>esto es lo que vas<br>a hacer con nosotros.</h2><p>Tu trabajo no es programar ni diseñar. Tu trabajo es encontrar negocios que necesitan mejorar, abrir la conversación, entender qué les está frenando y llevarlos hacia una solución que sí puedan pagar.</p></div><div class="grid"><div class="card dark"><div class="n">TU PARTE</div><h3>encuentra la oportunidad.</h3><p>Observa el negocio, detecta dónde pierde clientes y empieza la conversación.</p></div><div class="card"><div class="n">NUESTRA PARTE</div><h3>BOOSTR construye.</h3><p>Nosotros hacemos el website, sistema, branding, marketing o solución digital acordada.</p></div><div class="card dark"><div class="n">TU RESULTADO</div><div class="price green">USD</div><p>Ganas comisión cuando BOOSTR cobra una venta que ayudaste a cerrar.</p></div></div></section>

<section class="panel"><div class="hero"><div class="kicker">ENCONTRAR UN LEAD</div><h2>busca fricción.<br><span class="green">ahí hay oportunidad.</span></h2><p>Un lead potencial no es solamente un negocio que “se ve feo”. Busca negocios donde llegar desde el interés hasta la compra sea más difícil de lo que debería.</p></div><div class="grid"><div class="card"><div class="n">SEÑAL 01</div><h3>links que no ayudan.</h3><p>Enlaces rotos, menús viejos, formularios que no cargan o páginas que no explican cómo comprar.</p></div><div class="card dark"><div class="n">SEÑAL 02</div><h3>no entiendo el producto.</h3><p>No hay buenas fotos, precios claros, catálogo, demos ni una forma sencilla de entender qué vende el negocio.</p></div><div class="card"><div class="n">SEÑAL 03</div><h3>todo es manual.</h3><p>Reservas por DM, clientes sin seguimiento, pagos desordenados o información perdida entre mensajes.</p></div><div class="card full dark"><div class="n">LA PREGUNTA CLAVE</div><h3>¿dónde pierde tiempo o ventas?</h3><p>Si detectas ese punto ya tienes una razón para hablarle. No llegues diciendo “te vendo una página”. Llega entendiendo un problema y mostrando por qué resolverlo le conviene.</p></div></div></section>
<section class="panel"><div class="hero"><div class="kicker">ELEGIR LA OFERTA</div><h2>no vendas lo más caro.<br><span class="green">vende lo que encaja.</span></h2><p>Los tres precios existen para adaptar la solución al problema y a la realidad económica del negocio. Una empresa pequeña puede necesitar BOOSTR aunque todavía no pueda pagar $800.</p></div><div class="grid"><div class="card"><div class="n">ENTRADA</div><h3>website basic</h3><div class="price">$200</div><p>Para empezar con una presencia profesional y una forma clara de vender.</p></div><div class="card dark"><div class="n">CRECIMIENTO</div><h3>website pro</h3><div class="price">$500</div><p>Para negocios con más movimiento, contenido y necesidad de personalización.</p></div><div class="card"><div class="n">SISTEMA / CUSTOM</div><h3>advanced + systems</h3><div class="price green">$800+</div><p>Para procesos, CRM, pagos, automatización o sistemas hechos a medida.</p></div><div class="card full dark"><div class="n">CÓMO DECIDIR</div><h3>problema + capacidad de pago.</h3><p>Primero entiende qué necesita. Después observa tamaño, flujo y momento económico. El objetivo no es empujar un precio: es hacerle entender que el problema le cuesta tiempo, ventas o imagen y darle una solución que sí pueda comprar.</p></div></div></section>
<section class="panel"><div class="hero"><div class="kicker">ROMPER EL HIELO</div><h2>llega con una razón<br>para que te respondan.</h2><p>Tus leads pueden venir de tu búsqueda o del BOOSTR Lead Pool. Cuando un negocio es especialmente prometedor, puedes pedir apoyo antes de escribirle.</p></div><div class="grid"><div class="card dark"><div class="n">BOOSTR LEAD POOL</div><h3>hasta 10 leads BOOSTR por semana.</h3><p>Son negocios encontrados por BOOSTR con contexto, temperatura, canal recomendado y producto sugerido. Tus leads propios son ilimitados.</p></div><div class="card"><div class="n">LEAD PROPIO</div><h3>encuéntralo tú.</h3><p>Instagram, Google Maps, Facebook, TikTok, referencias o negocios que ves todos los días. Regístralo en Agent OS.</p></div><div class="card dark"><div class="n">DEMO POR ADELANTADO</div><h3>para leads muy buenos.</h3><p>Si hay potencial claro y una mejora visual puede abrir la puerta, pide a BOOSTR un demo previo antes de contactar.</p></div><div class="card full"><div class="n">APERTURA CON DEMO</div><div class="script"><button class="copy" data-copy="hola! nos tomamos el atrevimiento de preparar un demo rápido para mostrarle lo profesional que podría verse su negocio si quisiera trabajar con nosotros. soy agente de una compañía llamada BOOSTR — boost significa impulsar en inglés — y nuestro propósito es impulsar negocios con soluciones digitales. si quiere, se lo puedo enseñar sin compromiso.">copiar</button><p>hola! nos tomamos el atrevimiento de preparar un demo rápido para mostrarle lo profesional que podría verse su negocio si quisiera trabajar con nosotros. soy agente de una compañía llamada BOOSTR — boost significa impulsar en inglés — y nuestro propósito es impulsar negocios con soluciones digitales. si quiere, se lo puedo enseñar sin compromiso.</p></div></div></div></section>
<section class="panel"><div class="hero"><div class="kicker">TU KIT REAL</div><h2>todo esto vive<br>dentro de tu Agent OS.</h2><p>No es un preview. Cuando tu cuenta queda aprobada tienes Starter Kit, flyers, mensajes, Lead Pool, tus leads, comisiones y seguridad de acceso.</p></div><div class="card full" style="margin-top:14px"><div class="tools"><a class="tool" href="/#/agent/dashboard" target="_blank">Agent OS<small>tu centro de trabajo real</small></a><a class="tool" href="/showcase/" target="_blank">Demos BOOSTR<small>ejemplos para explicar y vender</small></a><a class="tool" href="/#/#services" target="_blank">Catálogo<small>productos, alcance y precios</small></a><a class="tool" href="/#/agent/dashboard" target="_blank">Starter Kit<small>reglas, catálogo y scripts</small></a><a class="tool" href="/#/agent/dashboard" target="_blank">Lead Pool<small>oportunidades BOOSTR</small></a><a class="tool" href="/#/agent/dashboard" target="_blank">Mis Leads<small>pipeline y seguimiento</small></a></div><div class="callout" style="margin-top:12px"><b>Antes de escribirle a alguien:</b> revisa el producto, guarda el lead y define el siguiente paso. Así no dependes de memoria ni de chats perdidos.</div></div></section>
<section class="panel"><div class="hero"><div class="kicker">MENSAJES + RESPUESTAS</div><h2>no improvises<br>lo importante.</h2><p>Usa los mensajes como base. Puedes sonar natural sin inventar precios, fechas ni detalles técnicos.</p></div><div id="scripts" class="card full" style="margin-top:14px"></div><div class="card full" style="margin-top:14px"><div class="n">FAQ RÁPIDO</div><div id="faq"></div></div></section>
<section class="panel"><div class="hero"><div class="kicker">TU PRIMER OBJETIVO</div><h2>entra en movimiento.<br><span class="green">no en teoría.</span></h2><p>No queremos una semana estudiando. Queremos que entiendas lo necesario, abras conversaciones reales y aprendas usando el sistema.</p></div><div class="card full" style="margin-top:14px"><div class="n">CHECKLIST DE ARRANQUE</div><h3>cuando completes esto, ya estás trabajando.</h3><div class="milestones" id="miles">${[['catalog','entiendo los 3 niveles de precio','sé cuándo ofrecer $200, $500 o $800+'],['demos','recorrí las demos','puedo enseñar ejemplos sin explicar tecnología'],['scripts','probé los mensajes','sé abrir, responder y escalar dudas'],['content','publiqué contenido oficial','ya tengo presencia como BOOSTR Agent'],['conv','abrí 10 conversaciones','con negocios reales'],['leads','registré 5 leads reales','cada uno tiene siguiente paso'],['calls','intenté mis primeras llamadas','aprendo el flujo aunque no cierre'],['pin','configuré mi PIN','mi Agent OS está listo']].map(x=>`<label class="mile"><input type="checkbox" data-k="${x[0]}"><span class="check"></span><span><strong>${x[1]}</strong><span>${x[2]}</span></span></label>`).join('')}</div><div class="ready"><div class="readytop"><div><small>AVANCE DE ARRANQUE</small><br><strong id="rt">0 / 8</strong></div><small id="rm">empieza por catálogo + demos</small></div><div class="meter"><span id="meter"></span></div></div></div></section>`;bind()}
function bind(){$$('#nav button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('#prev').onclick=()=>go(Math.max(0,current-1));$('#next').onclick=()=>go(Math.min(7,current+1));$$('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy||''));const boxes=$$('#miles input');let save={};try{save=JSON.parse(localStorage.getItem('boostr-start')||'{}')}catch{}boxes.forEach(b=>{b.checked=!!save[b.dataset.k];b.onchange=()=>{save[b.dataset.k]=b.checked;localStorage.setItem('boostr-start',JSON.stringify(save));ready()}});ready()}
const $$=s=>[...document.querySelectorAll(s)];function go(i){current=i;$$('.panel').forEach((p,n)=>p.classList.toggle('active',n===i));$$('#nav button').forEach((b,n)=>b.classList.toggle('active',n===i));$('#prog').textContent=`${i+1} / 8`;$('#fill').style.width=`${(i+1)*12.5}%`;window.scrollTo({top:0,behavior:'smooth'})}function ready(){const b=$$('#miles input'),d=b.filter(x=>x.checked).length;$('#rt').textContent=`${d} / 8`;$('#meter').style.width=`${d*12.5}%`;$('#rm').textContent=d===8?'listo para operar':d>=5?'ya estás en movimiento':d>=2?'sigue con conversaciones reales':'empieza por catálogo + demos'}
function profile(a){const p=parse(a.devices),av=parse(a.availability);const rows=[['origen',p.origin_country],['residencia',p.residence_country||a.country],['ciudad',a.city],['edad',p.age_range],['zona horaria',p.timezone||av.timezone],['idiomas',arr(p.languages)],['inglés',a.english_level],['ventas',a.sales_experience],['customer service',a.service_experience],['canales',arr(p.channels)],['llamadas',p.call_comfort],['dispositivos',arr(p.devices)],['horas',p.hours||av.hours],['inicio',p.start_when||av.start_when],['días',arr(p.days||av.days)],['meta semanal',p.weekly_goal],['industrias',arr(p.industries)],['motivación',p.motivation],['fortalezas',p.strengths],['cobro',arr(p.payment_methods)]];$('#profile').innerHTML=rows.map(x=>`<div><small>${esc(x[0])}</small><b>${esc(x[1]||'—')}</b></div>`).join('');$('#cand').innerHTML=`<b>${esc(a.name)}</b><small>${esc(p.origin_country||'—')} → ${esc(a.country||'—')} · ${esc(a.city||'')}</small><small>${esc(a.email)} · ${esc(a.whatsapp)}</small>`}
function fillScripts(){const fb=[{title:'nuevo inbound',text:'hola 👋 gracias por escribir a BOOSTR Labs\ncuéntame un poco de tu negocio y qué te gustaría mejorar'},{title:'outreach',text:'hola! estuve viendo su negocio y creo que hay varias cosas que BOOSTR podría ayudarles a mejorar online\ntrabajamos con páginas web, sistemas, automatización, branding y herramientas para negocios\nsi quieres te puedo enseñar algunas opciones'},{title:'pregunta técnica',text:'esa parte la confirmo con el equipo de BOOSTR para darte información correcta'}],list=scripts.length?scripts:fb;$('#scripts').innerHTML=list.map(s=>`<div class="script"><button class="copy" data-copy="${esc(s.text)}">copiar</button><b>${esc(s.title)}</b><p>${esc(s.text)}</p></div>`).join('');$$('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy||''));$('#faq').innerHTML=[['¿puedo cambiar un precio?','No. Los precios son iguales para todos.'],['¿puedo cobrarle al cliente?','No. El cliente paga directamente a BOOSTR.'],['¿qué hago si no sé algo técnico?','Lo confirmas con el equipo. No inventes.'],['¿tengo que usar leads BOOSTR?','No. Tus leads propios son ilimitados y además puedes reclamar hasta 10 leads BOOSTR por semana.'],['¿cuándo pido un demo adelantado?','Cuando el negocio tiene potencial claro y enseñar una mejora visual puede ayudarte a abrir la conversación.']].map(x=>`<div class="faq"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}
async function load(){build();$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();try{[apps,catalog,scripts]=await Promise.all([api('admin/applications'),api('public/catalog'),api('public/scripts')]);const sel=$('#sel');sel.innerHTML=apps.map((a,i)=>`<option value="${i}">${esc(a.name)} · ${esc(a.country)} · ${esc(a.status)}</option>`).join('')||'<option>sin aplicaciones</option>';if(apps[0])profile(apps[0]);sel.onchange=()=>apps[+sel.value]&&profile(apps[+sel.value]);fillScripts()}catch(e){$('#sel').innerHTML='<option>admin login requerido</option>';$('#cand').innerHTML='<b>inicia sesión como admin</b><small>luego vuelve para cargar aplicaciones</small>';fillScripts()}}load();
