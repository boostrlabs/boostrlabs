<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BOOSTR Agent LATAM | Interview Room</title><link rel="icon" href="/assets/icons/09.-b-star-favicon.png"><style>
:root{--bg:#f3f3f7;--ink:#08080a;--muted:#72727a;--line:#e1e1e7;--green:#59d47b;--lav:#dcd8ff;--sky:#cfe8ff;--peach:#ffd9c7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}button,a{font:inherit}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(25px);border-bottom:1px solid var(--line)}.topin{height:72px;max-width:1500px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:145px}.topactions{display:flex;gap:8px}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.dark{background:#08080a;color:#fff}.btn.light{background:#fff;border:1px solid var(--line);color:#08080a}.shell{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.side{background:#0a0a0c;color:#fff;border-radius:30px;padding:22px;min-height:calc(100vh - 112px);position:sticky;top:92px;align-self:start}.kicker{font-size:10px;font-weight:900;letter-spacing:.23em;text-transform:uppercase;color:#a9a9b1}.side h1{font-family:"Arial Black",Arial,sans-serif;font-size:36px;line-height:.9;letter-spacing:-.055em;margin:18px 0}.side p{color:#b8b8c0;font-size:13px;line-height:1.5}.candidate-select{width:100%;margin:16px 0;border:1px solid #33333a;border-radius:14px;background:#151519;color:#fff;padding:12px}.candidate{padding:14px;border-radius:18px;background:#151519;margin-top:12px}.candidate b{display:block;font-size:18px}.candidate small{display:block;color:#a5a5ad;margin-top:5px;line-height:1.4}.candidate-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{padding:6px 8px;border-radius:999px;background:#25252b;font-size:10px;font-weight:800}.tag.green{background:#173923;color:#91eba9}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;text-align:left;background:transparent;color:#a8a8b0;padding:11px 12px;border-radius:13px;font-weight:750;cursor:pointer}.nav button.active,.nav button:hover{background:#fff;color:#08080a}.main{min-width:0}.panel{display:none}.panel.active{display:block}.hero{background:#08080a;color:#fff;border-radius:34px;padding:46px;min-height:360px;position:relative;overflow:hidden;background-image:linear-gradient(rgba(188,181,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(188,181,255,.06) 1px,transparent 1px);background-size:92px 92px}.hero:after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;right:-190px;bottom:-310px;background:radial-gradient(circle,rgba(185,175,255,.4),rgba(134,200,255,.15) 48%,transparent 72%)}.hero>*{position:relative;z-index:1}.hero h2{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(52px,7vw,96px);line-height:.85;letter-spacing:-.07em;margin:24px 0}.hero .money{color:var(--green)}.hero p{max-width:800px;color:#cfcfd6;font-size:19px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.card{grid-column:span 4;background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;min-height:220px;position:relative;overflow:hidden}.card.half{grid-column:span 6}.card.full{grid-column:1/-1}.card.dark{background:#0b0b0e;color:#fff;border-color:#1c1c22}.card .n{font-size:10px;letter-spacing:.2em;font-weight:900;color:#888;text-transform:uppercase}.card.dark .n{color:#aaa}.card h3{font-family:"Arial Black",Arial,sans-serif;font-size:30px;line-height:.95;letter-spacing:-.045em;margin:18px 0 12px}.card p,.card li{color:#72727a;line-height:1.5;font-size:14px}.card.dark p,.card.dark li{color:#b9b9c1}.stat{font-family:"Arial Black",Arial,sans-serif;font-size:52px;letter-spacing:-.06em}.stat.green{color:var(--green)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool{display:block;padding:18px;border-radius:18px;background:#f7f7fa;border:1px solid var(--line);font-weight:850}.tool small{display:block;color:#7b7b83;margin-top:5px;font-weight:500}.script{background:#0b0b0e;color:#fff;border-radius:22px;padding:22px;margin-top:10px;position:relative}.script b{display:block;margin-bottom:9px}.script p{white-space:pre-line;color:#e5e5e8;margin:0;padding-right:76px}.copy{position:absolute;right:12px;top:12px;border:0;border-radius:10px;padding:8px 10px;font-weight:850;cursor:pointer}.faq{border-top:1px solid var(--line);padding:16px 0}.faq b{display:block;margin-bottom:6px}.faq p{margin:0;color:#707078;line-height:1.5}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profile-item{background:#f7f7fa;border:1px solid var(--line);border-radius:16px;padding:14px}.profile-item small{display:block;color:#85858c;text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-weight:850;margin-bottom:5px}.profile-item b{font-size:14px}.empty{padding:22px;border-radius:20px;background:#fff;border:1px solid var(--line);color:#777}.presentbar{display:flex;justify-content:space-between;gap:10px;margin:14px 0}.progress{font-size:12px;color:#777}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#09090b;color:#fff;padding:11px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:950px){.shell{grid-template-columns:1fr}.side{position:relative;top:0;min-height:0}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr 1fr}.card,.card.half{grid-column:auto}.card.full{grid-column:1/-1}.tools,.profile-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.topin{padding:0 14px}.logo{width:120px}.shell{padding:12px}.side{border-radius:25px;padding:18px}.hero{padding:30px 22px;border-radius:26px}.hero h2{font-size:48px}.hero p{font-size:16px}.grid{grid-template-columns:1fr}.card,.card.half,.card.full{grid-column:auto}.tools,.profile-grid{grid-template-columns:1fr}.presentbar{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="topin"><img class="logo" src="/assets/logos/boostr-logo-nav.png"><div class="topactions"><button class="btn light" id="fullBtn">Pantalla completa</button><a class="btn dark" href="/#/admin">Admin</a></div></div></header><main class="shell"><aside class="side"><div class="kicker">BOOSTR AGENT · INTERVIEW ROOM</div><h1>entrevista + onboarding.</h1><p>Panel para compartir por Discord o Zoom. Selecciona al candidato y recorre el flujo completo.</p><select id="candidateSelect" class="candidate-select"><option>Cargando aplicaciones…</option></select><div id="candidateCard" class="candidate"><b>Sin candidato seleccionado</b><small>Inicia sesión como ADMIN para cargar aplicaciones.</small></div><nav class="nav" id="nav"></nav></aside><section class="main"><div class="presentbar"><div class="progress" id="progress">1 / 8</div><div><button class="btn light" id="prev">← anterior</button> <button class="btn dark" id="next">siguiente →</button></div></div><div id="panels"></div></section></main><div class="toast" id="toast"></div><script>
const sections=[
['overview','Bienvenida'],['candidate','Candidato'],['workflow','Cómo funciona'],['products','Productos'],['kit','Kit de trabajo'],['scripts','Mensajes'],['faq','FAQ'],['first7','Primeros 7 días']];let current=0,apps=[],catalog=[],publicScripts=[],flyers=[];
const nav=document.querySelector('#nav'),panels=document.querySelector('#panels');
const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const parse=s=>{try{return JSON.parse(s||'{}')}catch{return {}}};
const arr=s=>Array.isArray(s)?s.join(', '):(s||'—');
async function api(path){const r=await fetch('/api/agent-os/'+path,{credentials:'include'});if(!r.ok)throw new Error(r.status===401?'ADMIN login requerido':'No se pudo cargar');return r.json()}
function build(){nav.innerHTML=sections.map((s,i)=>`<button data-i="${i}" class="${i===0?'active':''}">${String(i+1).padStart(2,'0')} · ${s[1]}</button>`).join('');panels.innerHTML=`
<section class="panel active" id="overview"><div class="hero"><div class="kicker">BOOSTR AGENT · LATAM</div><h2>no vendes solo.<br><span class="money">BOOSTR te respalda.</span></h2><p>Producto, precios, demos, contenido, scripts, leads y soporte en un solo sistema. El objetivo es que el agente siempre sepa qué hacer después.</p></div><div class="grid"><div class="card dark"><div class="n">ROL</div><h3>abre conversaciones.</h3><p>Detecta necesidades, presenta la opción correcta y mueve el lead hacia una llamada o cierre.</p></div><div class="card"><div class="n">BOOSTR</div><h3>ejecuta el producto.</h3><p>El agente no programa, diseña ni improvisa alcance técnico.</p></div><div class="card dark"><div class="n">PAGO</div><h3 class="stat green">USD</h3><p>Comisión sobre pagos realmente cobrados por BOOSTR.</p></div></div></section>
<section class="panel" id="candidate"><div class="hero"><div class="kicker">ANTES DE LA ENTREVISTA</div><h2>conoce a la<br>persona.</h2><p>Usa lo que llenó en la aplicación para adaptar ejemplos, canales, horarios y entrenamiento.</p></div><div class="card full" style="margin-top:14px"><div class="n">PERFIL DEL CANDIDATO</div><div id="candidateProfile" class="profile-grid" style="margin-top:18px"></div></div></section>
<section class="panel" id="workflow"><div class="hero"><div class="kicker">EL TRABAJO</div><h2>postea.<br>conversa.<br><span class="money">cierra.</span></h2><p>Un agente puede traer sus propios leads o tomar oportunidades del BOOSTR Lead Pool.</p></div><div class="grid"><div class="card"><div class="n">01</div><h3>publica.</h3><p>Usa flyers y contenido oficial. No cambies precios, logos ni promesas sin autorización.</p></div><div class="card dark"><div class="n">02</div><h3>responde.</h3><p>Rompe el hielo, pregunta por el negocio y detecta el problema antes de ofrecer.</p></div><div class="card"><div class="n">03</div><h3>mueve el lead.</h3><p>Chat → llamada → propuesta → pago. Cada conversación tiene un siguiente paso.</p></div><div class="card half dark"><div class="n">LEAD POOL</div><h3>hasta 10 por semana.</h3><p>Los leads BOOSTR traen contexto, temperatura, canal recomendado y producto sugerido. Los leads propios son ilimitados.</p></div><div class="card half dark"><div class="n">PIPELINE</div><h3>nunca pierdas el hilo.</h3><p>NUEVO → CONTACTADO → RESPONDIÓ → INTERESADO → LLAMADA AGENDADA → PROPUESTA → PAGÓ / PERDIDO.</p></div></div></section>
<section class="panel" id="products"><div class="hero"><div class="kicker">CATÁLOGO</div><h2>vende lo que<br>el negocio necesita.</h2><p>No memorices tecnología. Aprende a reconocer problemas: mala presencia, falta de seguimiento, procesos manuales o pérdida de clientes.</p></div><div id="productGrid" class="grid"></div></section>
<section class="panel" id="kit"><div class="hero"><div class="kicker">KIT DE TRABAJO</div><h2>todo a<br>la mano.</h2><p>Estas son las herramientas que el agente debe abrir antes de empezar a conversar con clientes.</p></div><div class="card full" style="margin-top:14px"><div class="tools"><a class="tool" href="/showcase/" target="_blank">Demos BOOSTR<small>Ver sistemas reales y ejemplos</small></a><a class="tool" href="/#/#services" target="_blank">Catálogo<small>Productos y servicios actuales</small></a><a class="tool" href="/#/agent/dashboard" target="_blank">Agent OS<small>Leads, comisiones y recursos</small></a><a class="tool" href="/#/work" target="_blank">Programa Agent<small>Explicación pública</small></a><a class="tool" href="/#/agent/apply" target="_blank">Aplicación<small>Link para candidatos</small></a><a class="tool" href="/showcase/demos/payments/" target="_blank">Demo Payments<small>Cómo se ve un flujo de cobro</small></a></div><div id="flyerTools" class="tools" style="margin-top:10px"></div></div></section>
<section class="panel" id="scripts"><div class="hero"><div class="kicker">COPY / PASTE</div><h2>siempre sabes<br>qué responder.</h2><p>Usa estos mensajes como base. Adáptalos al negocio sin inventar información técnica o precios.</p></div><div id="scriptsBox" class="card full" style="margin-top:14px"></div></section>
<section class="panel" id="faq"><div class="hero"><div class="kicker">FAQ DEL AGENTE</div><h2>no improvises.</h2><p>Si no sabes algo técnico, lo escalas. La confianza viene de dar información correcta.</p></div><div class="card full" style="margin-top:14px" id="faqBox"></div></section>
<section class="panel" id="first7"><div class="hero"><div class="kicker">ONBOARDING</div><h2>los primeros<br><span class="money">7 días.</span></h2><p>La meta inicial no es saberlo todo. Es aprender el sistema, abrir conversaciones y crear consistencia.</p></div><div class="grid"><div class="card"><div class="n">DÍA 1</div><h3>catálogo + precios.</h3><p>Entiende qué vendemos y qué problema resuelve cada producto.</p></div><div class="card dark"><div class="n">DÍA 2</div><h3>scripts + demos.</h3><p>Practica aperturas, respuestas, objeciones y recorrido del showcase.</p></div><div class="card"><div class="n">DÍA 3</div><h3>publica.</h3><p>Mínimo 3 piezas de contenido oficial en tus canales.</p></div><div class="card dark"><div class="n">DÍAS 4–5</div><h3>10 conversaciones.</h3><p>Busca negocios, inicia conversaciones y registra cada lead.</p></div><div class="card"><div class="n">DÍA 6</div><h3>5 leads reales.</h3><p>Califica interés, actualiza pipeline y pide ayuda en los casos complejos.</p></div><div class="card dark"><div class="n">DÍA 7</div><h3>intenta 2 llamadas.</h3><p>Practica llevar una conversación desde problema hasta siguiente paso.</p></div></div></section>`;
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>open(+b.dataset.i));fillStatic()}
function open(i){current=Math.max(0,Math.min(sections.length-1,i));document.querySelectorAll('.panel').forEach((p,n)=>p.classList.toggle('active',n===current));nav.querySelectorAll('button').forEach((b,n)=>b.classList.toggle('active',n===current));document.querySelector('#progress').textContent=`${current+1} / ${sections.length}`;window.scrollTo({top:0,behavior:'smooth'})}
function fillStatic(){const base=[['Nuevo inbound','hola 👋 gracias por escribir a BOOSTR Labs\ncuéntame un poco de tu negocio y qué te gustaría mejorar'],['Outreach','hola! estuve viendo su negocio y creo que hay varias cosas que BOOSTR podría ayudarles a mejorar online\ntrabajamos con páginas web, sistemas, automatización, branding y herramientas para negocios\nsi quieres te puedo enseñar algunas opciones'],['Ya mostró interés','perfecto, lo mejor es hacer una llamada corta con nuestro equipo para revisar exactamente lo que necesitas y recomendarte la mejor opción\nqué día y hora te funciona?'],['Pregunta técnica','esa parte la confirmo con el equipo de BOOSTR para darte información correcta'],['Precio / descuento','los precios los maneja BOOSTR de forma estándar para todos. si me dices qué necesitas te enseño cuál opción encaja mejor'],['No responde','hola! paso por aquí por si no viste mi mensaje anterior. si todavía quieres mejorar esa parte del negocio te puedo enseñar una opción rápida'],['No está listo','tranquilo, no hay problema. si quieres te dejo la info y cuando sea buen momento lo retomamos'],['Quiere pensarlo','claro. te dejo todo para que lo revises con calma. si te surge cualquier pregunta me escribes y la confirmamos con el equipo']];document.querySelector('#scriptsBox').innerHTML=base.map(([n,t])=>`<div class="script"><button class="copy" data-copy="${esc(t)}">copiar</button><b>${n}</b><p>${esc(t)}</p></div>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('copiado')));const faq=[['¿Tengo que saber programación?','No. Tu trabajo es comunicación, descubrimiento, seguimiento y cierre. Lo técnico se escala.'],['¿Puedo cambiar el precio?','No. Los precios y descuentos los define BOOSTR.'],['¿Quién cobra al cliente?','BOOSTR. El cliente nunca debe pagarle directamente al agente.'],['¿Cuándo gano comisión?','Cuando BOOSTR cobra realmente el pago del cliente y la venta queda atribuida a ti.'],['¿Qué pasa si no sé responder?','No inventes. Usa el mensaje de escalamiento y confirma con el equipo.'],['¿Cuántos leads me da BOOSTR?','Puedes tomar hasta 10 leads del pool por semana. Tus propios leads son ilimitados.'],['¿Puedo usar mis redes?','Sí. Instagram, WhatsApp, TikTok, Facebook, email o llamadas, según el negocio.'],['¿Puedo prometer fechas o funciones?','No sin confirmación. Alcance, tiempos y detalles técnicos se validan con BOOSTR.'],['¿Esto garantiza ingresos?','No. Es trabajo por comisión; lo que ganas depende de ventas cobradas.']];document.querySelector('#faqBox').innerHTML=faq.map(([q,a])=>`<div class="faq"><b>${q}</b><p>${a}</p></div>`).join('')}
async function load(){try{const [a,c,s,f]=await Promise.all([api('admin/applications'),api('public/catalog').catch(()=>[]),api('public/scripts').catch(()=>[]),api('public/flyers').catch(()=>[])]);apps=a;catalog=c;publicScripts=s;flyers=f;const sel=document.querySelector('#candidateSelect');sel.innerHTML='<option value="">Selecciona candidato</option>'+apps.map((x,i)=>`<option value="${i}">${esc(x.name)} · ${esc(x.country)} · ${esc(x.status)}</option>`).join('');sel.onchange=()=>selectCandidate(+sel.value);renderProducts();renderFlyers()}catch(e){document.querySelector('#candidateSelect').innerHTML='<option>ADMIN login requerido</option>';document.querySelector('#candidateCard').innerHTML=`<b>Inicia sesión como ADMIN</b><small>Abre el Admin de BOOSTR en otra pestaña y vuelve a recargar esta página.</small>`;renderProducts();renderFlyers()}}
function selectCandidate(i){const a=apps[i];if(!a)return;const p=parse(a.devices),av=parse(a.availability);document.querySelector('#candidateCard').innerHTML=`<b>${esc(a.name)}</b><small>${esc(p.origin_country||'—')} → ${esc(a.country)} · ${esc(a.city)}<br>${esc(a.email)} · ${esc(a.whatsapp)}</small><div class="candidate-tags"><span class="tag green">${esc(a.status)}</span><span class="tag">${esc(p.hours||av.hours||'horario n/d')}</span><span class="tag">${esc(a.english_level||'inglés n/d')}</span></div>`;const fields=[['Origen',p.origin_country],['Residencia',a.country+' · '+a.city],['Edad',p.age_range],['Zona horaria',p.timezone||av.timezone],['Idiomas',arr(p.languages)],['Inglés',a.english_level],['Ventas',a.sales_experience],['Customer service',a.service_experience],['Canales',arr(p.channels)],['Dispositivos',arr(p.devices)],['Llamadas',p.call_comfort],['Video',p.video_comfort],['Horas / semana',p.hours||av.hours],['Días',arr(p.days||av.days)],['Inicio',p.start_when],['Industrias',arr(p.industries)],['Meta semanal',p.weekly_goal],['Pagos',arr(p.payment_methods)],['Motivación',p.motivation],['Fortalezas',p.strengths]];document.querySelector('#candidateProfile').innerHTML=fields.map(([k,v])=>`<div class="profile-item"><small>${k}</small><b>${esc(v||'—')}</b></div>`).join('')}
function renderProducts(){const data=catalog.length?catalog:[{name:'Website Starter',price:200,description:'Presencia profesional para negocios'},{name:'Website Pro',price:500,description:'Web más completa para captar clientes'},{name:'Custom / Systems',price:800,description:'Sistemas, apps y automatización a medida'}];document.querySelector('#productGrid').innerHTML=data.slice(0,6).map((x,i)=>`<div class="card ${i%2?'dark':''}"><div class="n">PRODUCTO ${String(i+1).padStart(2,'0')}</div><h3>${esc(x.name)}</h3><div class="stat ${i===2?'green':''}">${x.price?'$'+x.price+(x.price>=800?'+':''):'custom'}</div><p>${esc(x.description||'Producto BOOSTR')}</p></div>`).join('')}
function renderFlyers(){document.querySelector('#flyerTools').innerHTML=(flyers||[]).slice(0,6).map(f=>`<a class="tool" href="${esc(f.asset_path||f.url||'#')}" target="_blank">${esc(f.name||f.title||'Flyer BOOSTR')}<small>Contenido oficial listo para compartir</small></a>`).join('')}
document.querySelector('#prev').onclick=()=>open(current-1);document.querySelector('#next').onclick=()=>open(current+1);document.querySelector('#fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();build();load();
</script></body></html>
